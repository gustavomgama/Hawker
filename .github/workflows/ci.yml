name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUNDLE_FROZEN: "true"

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hawker
          POSTGRES_PASSWORD: hawker
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Run CI
        run: ruby bin/ci

      - name: Assert no tracked file changed
        run: git diff --exit-code

      - name: Upload RubyCritic report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rubycritic-report
          path: tmp/rubycritic
          if-no-files-found: ignore
